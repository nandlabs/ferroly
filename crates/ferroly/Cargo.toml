[package]
name = "ferroly"
description = "A self-contained Rust toolkit of enterprise utilities (a port of nandlabs/golly)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["toolkit", "genai", "http", "codec", "ferroly"]
categories = ["development-tools", "web-programming"]

[dependencies]
ferroly-derive = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }

[features]
default = ["codec", "errutils"]
errutils = []
codec = []
config = ["codec"]
fsutils = []
lifecycle = [
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/macros",
    "tokio/signal",
]
http = [
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/macros",
    "tokio/net",
    "tokio/io-util",
    "tokio/fs",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
]
clients = ["http", "hash", "codec", "dep:tokio"]
genai = ["codec", "clients", "http", "dep:tokio"]
openai = ["genai"]
claude = ["genai"]
ollama = ["genai"]
all-providers = ["openai", "claude", "ollama"]
turbo = ["http", "codec"]
rest = ["turbo", "clients", "codec", "lifecycle", "http"]
ws = ["http", "lifecycle", "hash", "dep:tokio"]
vectorstore = ["codec"]
auth = ["codec", "hash"]
log = ["codec"]
metrics = []
messaging = ["codec", "lifecycle", "dep:tokio"]
vfs = ["dep:tokio", "tokio/rt", "tokio/fs", "tokio/io-util"]
hash = []
# The runtime surface re-exports all of tokio, so it is the one feature that
# enables `tokio/full`.
rt = ["dep:tokio", "tokio/full"]
# Adds the paused test clock (`rt::time::{pause, advance, resume}`). Test-only.
rt-test-util = ["rt", "tokio/test-util"]
cli = []
obs = ["codec"]
full = [
    "errutils",
    "codec",
    "cli",
    "log",
    "config",
    "fsutils",
    "lifecycle",
    "hash",
    "http",
    "clients",
    "genai",
    "all-providers",
    "rt",
    "turbo",
    "rest",
    "ws",
    "vectorstore",
    "auth",
    "messaging",
    "vfs",
    "metrics",
    "obs",
]

[dev-dependencies]
# `test-util` (not part of tokio's `full`) enables the paused test clock used to
# make timing-dependent tests deterministic. Dev-only — no runtime impact.
tokio = { workspace = true, features = ["full", "test-util"] }

[[example]]
name = "codec_roundtrip"
required-features = ["codec"]

# The model-router example needs a concrete provider (which pulls `genai`).
[[example]]
name = "model_router"
required-features = ["openai"]

[lints]
workspace = true

# Build docs on docs.rs with every feature enabled, so all modules are visible
# (the default build would show only the default features).
[package.metadata.docs.rs]
all-features = true
