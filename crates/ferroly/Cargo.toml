[package]
name = "ferroly"
description = "A self-contained Rust toolkit of enterprise utilities (a port of nandlabs/golly)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["toolkit", "genai", "http", "codec", "ferroly"]
categories = ["development-tools", "web-programming"]

[dependencies]
ferroly-derive = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
log-facade = { workspace = true, optional = true }

[features]
default = ["codec", "errutils", "tls-ring"]
errutils = []
codec = []
config = ["codec"]
fsutils = []
lifecycle = [
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/macros",
    "tokio/signal",
]
http = [
    "dep:tokio",
    "tokio/rt",
    "tokio/sync",
    "tokio/time",
    "tokio/macros",
    "tokio/net",
    "tokio/io-util",
    "tokio/fs",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:webpki-roots",
]
# `ring` as the rustls crypto backend, used when the application has not
# installed a process-default CryptoProvider. Turn default features off to bring
# your own (e.g. aws-lc-rs). Does not enable `http` by itself.
tls-ring = ["rustls?/ring", "tokio-rustls?/ring"]
clients = ["http", "hash", "codec", "dep:tokio"]
genai = ["codec", "clients", "http", "dep:tokio"]
openai = ["genai"]
claude = ["genai"]
ollama = ["genai"]
all-providers = ["openai", "claude", "ollama"]
# HTTP/2 (h2 over TLS with ALPN, cleartext h2c with prior knowledge) for
# the `http` server and client.
http2 = ["http"]
turbo = ["http", "codec"]
rest = ["turbo", "clients", "codec", "lifecycle", "http"]
ws = ["http", "lifecycle", "hash", "dep:tokio"]
vectorstore = ["codec"]
# A sandboxed Jinja2-subset template engine (chat templates and the like).
template = ["codec"]
auth = ["codec", "hash", "sig"]
log = ["codec"]
# Routes records from the `log` facade crate into `ferroly::log`. The only
# feature that adds a crate outside the tokio/rustls budget: `log`, which has
# no dependencies of its own.
log-bridge = ["log", "dep:log-facade"]
metrics = []
messaging = ["codec", "lifecycle", "dep:tokio"]
vfs = ["dep:tokio", "tokio/rt", "tokio/fs", "tokio/io-util"]
hash = []
sig = ["hash"]
# Content-addressed cache + artifact fetch plumbing; one feature per adapter.
store = ["http", "hash"]
store-s3 = ["store", "codec"]
store-hf = ["store"]
store-oci = ["store", "codec"]
protobuf = []
# gRPC (unary and streaming RPCs, status, metadata, deadlines, a codegen
# service generator) over the `http2` server and client, with `protobuf`
# messages. `hash` provides base64 for binary metadata.
grpc = ["http2", "protobuf", "hash"]
# The runtime surface re-exports all of tokio, so it is the one feature that
# enables `tokio/full`.
rt = ["dep:tokio", "tokio/full"]
# Adds the paused test clock (`rt::time::{pause, advance, resume}`). Test-only.
rt-test-util = ["rt", "tokio/test-util"]
cli = []
# With tokio present (the OTLP exporter, `obs` + `http`), the blocking
# `Exporter::flush` needs `block_in_place` from tokio's multi-thread runtime.
obs = ["codec", "tokio?/rt-multi-thread"]
full = [
    "errutils",
    "codec",
    "cli",
    "log",
    "log-bridge",
    "config",
    "fsutils",
    "lifecycle",
    "hash",
    "http",
    "http2",
    "clients",
    "genai",
    "all-providers",
    "rt",
    "turbo",
    "rest",
    "ws",
    "vectorstore",
    "auth",
    "messaging",
    "vfs",
    "metrics",
    "obs",
    "tls-ring",
    "sig",
    "store",
    "store-s3",
    "store-hf",
    "store-oci",
    "protobuf",
    "grpc",
    "template",
]

[dev-dependencies]
# `test-util` (not part of tokio's `full`) enables the paused test clock used to
# make timing-dependent tests deterministic. Dev-only — no runtime impact.
tokio = { workspace = true, features = ["full", "test-util"] }

[[example]]
name = "codec_roundtrip"
required-features = ["codec"]

# The model-router example needs a concrete provider (which pulls `genai`).
[[example]]
name = "model_router"
required-features = ["openai"]

# Interop and conformance harnesses run in CI (.github/workflows/interop.yml).
[[example]]
name = "grpc_interop"
required-features = ["grpc"]

[[example]]
name = "h2spec_server"
required-features = ["http2"]

[lints]
workspace = true

# Build docs on docs.rs with every feature enabled, so all modules are visible
# (the default build would show only the default features).
[package.metadata.docs.rs]
all-features = true
