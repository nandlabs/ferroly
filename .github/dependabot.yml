version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    ignore:
      # Held back for the MSRV (1.75): newer releases of these transitive
      # crates require edition 2024. Remove these entries when the MSRV is
      # raised, and review them whenever one of the crates has an advisory.
      - dependency-name: "zeroize"
      - dependency-name: "cc"
      - dependency-name: "find-msvc-tools"
      # tokio 1.54 requires Rust 1.85. Patch releases of 1.53 still arrive.
      - dependency-name: "tokio"
        versions: [">=1.54"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 10
    ignore:
      # `dtolnay/rust-toolchain` publishes no releases: it is pinned to a
      # commit of its `master` branch, and the toolchain is chosen with the
      # `toolchain:` input ("1.75.0" in the MSRV job). Bump the commit by hand
      # after reviewing the action's diff.
      - dependency-name: "dtolnay/rust-toolchain"
