name: Fuzz

# Short coverage-guided fuzz bursts over the hand-rolled, untrusted-input
# parsers. The always-on "fuzz-lite" suite runs in normal CI; this job adds real
# libFuzzer coverage on a schedule without slowing every PR down.
on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        default: "120"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [json_parse, xml_parse, yaml_parse, toml_parse, template_render, regex_match, ed25519_verify, proto_decode, h2_frames, h2_conn, grpc_frames, www_authenticate, ed25519_structured, template_jinja]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '120' }}
        run: |
          set -euo pipefail
          target="$TARGET"
          if ! [[ "$SECONDS_PER_TARGET" =~ ^[0-9]+$ ]]; then
            echo "::error::seconds must be a whole number, got '$SECONDS_PER_TARGET'"
            exit 1
          fi
          mkdir -p "fuzz/corpus/$target"
          # libFuzzer writes to the first directory and only reads the rest, so
          # the committed seeds (where a target has them) go second.
          dirs=("fuzz/corpus/$target")
          if [ -d "fuzz/seeds/$target" ]; then dirs+=("fuzz/seeds/$target"); fi
          cargo +nightly fuzz run "$target" "${dirs[@]}" -- \
            "-max_total_time=$SECONDS_PER_TARGET" -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
