name: Fuzz

# Short coverage-guided fuzz bursts over the hand-rolled, untrusted-input
# parsers. The always-on "fuzz-lite" suite runs in normal CI; this job adds real
# libFuzzer coverage on a schedule without slowing every PR down.
on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        default: "120"

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [json_parse, xml_parse, yaml_parse, toml_parse, template_render]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@cargo-fuzz
      - name: Fuzz ${{ matrix.target }}
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          mkdir -p "fuzz/corpus/$target"
          # libFuzzer writes to the first directory and only reads the rest, so
          # the committed seeds (where a target has them) go second.
          dirs=("fuzz/corpus/$target")
          if [ -d "fuzz/seeds/$target" ]; then dirs+=("fuzz/seeds/$target"); fi
          cargo +nightly fuzz run "$target" "${dirs[@]}" -- \
            -max_total_time=${{ inputs.seconds || '120' }} -rss_limit_mb=2048
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
