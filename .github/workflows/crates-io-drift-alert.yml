name: crates.io drift alert

# A red scheduled run is easy to miss: GitHub mails only the last person who
# edited the cron line. When the daily `crates.io drift` run fails, open a
# tracking issue, or comment on the one that is already open, so the
# maintainers see it. Close the issue once the release is on crates.io.
#
# This is a separate workflow so that `crates-io-drift.yml`, which
# `publish.yml` also calls, needs nothing beyond `contents: read`.
# `workflow_run` always runs this file from the default branch, and it checks
# out no code.
on:
  workflow_run:
    workflows: ["crates.io drift"]
    types: [completed]

permissions:
  contents: read

jobs:
  alert:
    name: Open or update the drift issue
    if: >-
      github.repository == 'nandlabs/ferroly' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          TITLE: "crates.io drift: a release is not on crates.io"
        run: |
          set -euo pipefail
          BODY="The daily crates.io drift check failed: $RUN_URL

          Its log names each tag that is missing from crates.io. Publish it with Actions → *Publish to crates.io* → *Run workflow* on \`main\` (CONTRIBUTING.md, \"Publishing to crates.io\"), then close this issue."
          number="$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
            echo "Commented on #$number."
          else
            gh issue create --title "$TITLE" --body "$BODY"
            echo "Opened a tracking issue."
          fi
