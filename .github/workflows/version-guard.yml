name: Version guard

# Guards releases on PRs into `main`:
#   1. The crate version (workspace Cargo.toml) and the README version badge
#      must agree.
#   2. That version must not already be published as a `v<version>` git tag —
#      otherwise the version needs bumping before merge.
#   3. `.github/scripts/check-release-version.sh`, which tag-on-merge and
#      publish.yml run too: both crates carry that version, ferroly requires
#      ferroly-derive at it, and CHANGELOG.md has a `## [<version>]` entry.
# PRs that change nothing under `crates/` or the root `Cargo.toml` are exempt
# (nothing is released).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-guard:
    name: Version consistency & unused tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0     # need full history + tags
          fetch-tags: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable

      - name: Check versions and tag
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Only changes to the published crates are releases. That is anything
          # under `crates/`, and the root `Cargo.toml`, whose
          # `[workspace.package]` and `[workspace.dependencies]` are inlined
          # into both published manifests. A PR that touches neither (CI, docs,
          # the lockfile, Dependabot bumps) ships no new crate contents, so it
          # needs no version bump.
          BASE="origin/$BASE_REF"
          if ! git diff --name-only "$BASE...HEAD" | grep -qE '^(crates/|Cargo\.toml$)'; then
            echo "No changes under crates/ or to the root Cargo.toml — version guard skipped."
            exit 0
          fi

          # Crate version from [workspace.package] in the root Cargo.toml.
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"

          # Version from the README shields.io badge (…/badge/version-X.Y.Z-…).
          README_VERSION="$(grep -oE 'version-[0-9]+\.[0-9]+\.[0-9]+-' README.md | head -1 | sed -E 's/version-([0-9.]+)-/\1/')"

          echo "Cargo version : ${CARGO_VERSION:-<none>}"
          echo "README version: ${README_VERSION:-<none>}"

          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::Could not read the crate version from Cargo.toml"
            exit 1
          fi
          if [ -z "$README_VERSION" ]; then
            echo "::error::Could not read the version badge from README.md"
            exit 1
          fi

          # 1) Cargo and README must match.
          if [ "$CARGO_VERSION" != "$README_VERSION" ]; then
            echo "::error::Version mismatch — Cargo.toml is $CARGO_VERSION but the README badge is $README_VERSION. Update both to the same version."
            exit 1
          fi

          # 2) The version must not already be tagged/released.
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/v$CARGO_VERSION" >/dev/null; then
            echo "::error::Tag v$CARGO_VERSION already exists — bump the version in Cargo.toml and the README before merging."
            exit 1
          fi

          # 3) The release check that tag-on-merge and publish.yml run as well:
          #    both crates and the derive requirement carry this version, and
          #    CHANGELOG.md documents it ("## [Unreleased]" does not count).
          bash .github/scripts/check-release-version.sh "$CARGO_VERSION"

          echo "OK: version $CARGO_VERSION is consistent, not yet tagged, and documented in CHANGELOG.md."
